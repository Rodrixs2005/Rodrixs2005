yaml name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"

  repository_dispatch:
    types:
      - update-streak

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=transparent&hide_border=true&date_format=j%20M%5B%20Y%5D&card_width=500&stroke=FFFFFF&ring=0064FF&fire=FF7000&currStreakNum=FF7000&sideNums=0064FF&currStreakLabel=FF7000&sideLabels=0064FF&dates=0064FF
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update streak stats"
          git push
